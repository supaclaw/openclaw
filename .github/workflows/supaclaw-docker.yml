name: Supaclaw Docker

on:
  release:
    types:
      - created

env:
  DOCKERHUB_REPO: craftslab/openclaw
  # Bookworm-based Node images can abort at startup on older Docker/seccomp
  # hosts when glibc thread creation hits clone3 restrictions. Keep the
  # Supaclaw Docker Hub release image on Bullseye for broader runtime support.
  SUPACLAW_NODE_BASE_IMAGE: node:24-bullseye

jobs:
  # Build amd64 main image
  build-main-amd64:
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.SUPACLAW_DOCKERHUB_USER }}
          password: ${{ secrets.SUPACLAW_DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_REPO }}
          tags: |
            type=semver,pattern={{version}},suffix=-amd64

      - name: Build and push amd64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            OPENCLAW_NODE_BOOKWORM_IMAGE=${{ env.SUPACLAW_NODE_BASE_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=registry,ref=${{ env.DOCKERHUB_REPO }}-cache:amd64
          cache-to: type=registry,ref=${{ env.DOCKERHUB_REPO }}-cache:amd64,mode=max
          provenance: false

  # Build arm64 main image
  build-main-arm64:
    runs-on: ubuntu-24.04-arm
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.SUPACLAW_DOCKERHUB_USER }}
          password: ${{ secrets.SUPACLAW_DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_REPO }}
          tags: |
            type=semver,pattern={{version}},suffix=-arm64

      - name: Build and push arm64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          build-args: |
            OPENCLAW_NODE_BOOKWORM_IMAGE=${{ env.SUPACLAW_NODE_BASE_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=registry,ref=${{ env.DOCKERHUB_REPO }}-cache:arm64
          cache-to: type=registry,ref=${{ env.DOCKERHUB_REPO }}-cache:arm64,mode=max
          provenance: false

  # Create multi-platform main manifest
  create-main-manifest:
    runs-on: ubuntu-latest
    needs: [build-main-amd64, build-main-arm64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.SUPACLAW_DOCKERHUB_USER }}
          password: ${{ secrets.SUPACLAW_DOCKERHUB_TOKEN }}

      - name: Resolve manifest tags
        id: tags
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ -z "$version" ]]; then
            echo "::error::Unable to resolve release version from tag ${RELEASE_TAG}"
            exit 1
          fi
          {
            echo "version=${version}"
            echo "target=${{ env.DOCKERHUB_REPO }}:${version}"
            echo "amd64=${{ env.DOCKERHUB_REPO }}:${version}-amd64"
            echo "arm64=${{ env.DOCKERHUB_REPO }}:${version}-arm64"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push manifest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${{ steps.tags.outputs.target }}" \
            "${{ steps.tags.outputs.amd64 }}" \
            "${{ steps.tags.outputs.arm64 }}"
